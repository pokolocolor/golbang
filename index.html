<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>골방 | 스크린골프 방배정 앱</title>

  <meta
    name="description"
    content="스크린골프 모임을 위한 방배정 앱 골방. 방 등록, 참석자 등록, 랜덤 배정, 핸디 균형 배정을 간편하게 사용할 수 있습니다."
  />
  <meta name="theme-color" content="#0f2a43" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css" />

  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-badge">SCREEN GOLF ROOM DRAW</div>
      <h1 class="hero-title">골방</h1>
      <p class="hero-desc">
        스크린골프 모임을 더 편하게.  
        방 등록과 참석자 등록 후 랜덤 또는 핸디 균형 배정을 바로 진행하세요.
      </p>

      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-label">등록된 방</span>
          <strong id="roomCount">0</strong>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-label">등록된 참석자</span>
          <strong id="peopleCount">0</strong>
        </div>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel">
        <div class="panel-head">
          <h2>🏌️ 방 등록</h2>
          <p>방 이름 또는 번호를 입력하고 필요하면 좌타방으로 표시하세요.</p>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="roomName">방 이름 / 번호</label>
            <input
              id="roomName"
              type="text"
              placeholder="예: 1, A, VIP"
              autocomplete="off"
            />
          </div>

          <label class="check-field">
            <input id="roomLeft" type="checkbox" />
            <span>좌타방</span>
          </label>

          <button id="addRoomBtn" class="primary-btn" type="button">
            + 방 등록
          </button>
        </div>

        <div class="list-wrap">
          <div class="list-head">
            <h3>등록된 방 목록</h3>
          </div>
          <div id="roomList" class="list-box"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>👥 참석자 등록</h2>
          <p>이름과 핸디를 입력하고 좌타 여부를 선택하세요.</p>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="personName">참석자 이름</label>
            <input
              id="personName"
              type="text"
              placeholder="예: 홍길동"
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="personHandicap">핸디</label>
            <input
              id="personHandicap"
              type="number"
              inputmode="numeric"
              placeholder="예: 12"
            />
          </div>

          <label class="check-field">
            <input id="personLeft" type="checkbox" />
            <span>좌타</span>
          </label>

          <button id="addPersonBtn" class="primary-btn" type="button">
            + 참석자 등록
          </button>
        </div>

        <div class="list-wrap">
          <div class="list-head">
            <h3>등록된 참석자 목록</h3>
          </div>
          <div id="peopleList" class="list-box"></div>
        </div>
      </section>
    </main>

    <section class="action-panel">
      <div class="panel-head">
        <h2>🎯 방배정 실행</h2>
        <p>원하는 방식으로 배정을 진행해보세요.</p>
      </div>

      <div class="action-buttons">
        <button id="drawRandomBtn" class="action-btn random" type="button">
          🎲 랜덤 방배정
        </button>
        <button id="drawHandicapBtn" class="action-btn handicap" type="button">
          ⚖️ 핸디 균형 배정
        </button>
        <button id="resetBtn" class="action-btn reset" type="button">
          🗑 전체 초기화
        </button>
      </div>
    </section>

    <section class="result-section">
      <div class="panel-head">
        <h2>📋 배정 결과</h2>
        <p>배정 결과가 아래에 순차적으로 표시됩니다.</p>
      </div>
      <div id="result"></div>
    </section>
  </div>
</body>
</html>
